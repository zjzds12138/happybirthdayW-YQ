    .tracking{display:grid;gap:13px;text-align:left}.tracking-card{padding:15px 16px 14px;background:#fff7df;border:1px solid #ebd49b;border-radius:16px;position:relative}
    .tracking-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;color:#a08252;font-size:12px;font-weight:800}.tracking-number{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;word-break:break-all;font-size:17px;letter-spacing:.035em;color:#755633;font-weight:800;line-height:1.5}.tracking-note{font-size:11px;color:#b49b73}.copy-btn{border:1px solid #e0c183;border-radius:10px;color:#856231;background:#fffefa;padding:4px 11px;font-size:12px}.copy-btn:disabled{opacity:.5}
    .gift-question{margin-top:25px;font-weight:850;font-size:20px;color:#88602b}.gift-ending{font-size:13px;color:#aa8a5f;margin-top:8px}.gift-stars{color:#e4b64b;letter-spacing:.6em;margin-top:12px}
    .confetti{position:fixed;z-index:70;left:var(--x);top:-10vh;width:var(--s);height:calc(var(--s)*1.2);background:var(--c);border-radius:2px;pointer-events:none;animation:fall var(--t) ease-in forwards;transform:rotate(var(--r))}@keyframes fall{to{top:110vh;transform:translateX(var(--drift)) rotate(720deg);opacity:0}}

    @media(max-width:700px){.app{margin:12px auto 35px;width:min(100% - 18px,620px)}.content{padding:33px 22px 28px;min-height:auto}.intro-grid{grid-template-columns:1fr;gap:0;text-align:center}.intro-copy{order:1}.intro-copy p{margin:auto}.intro-copy .little-note{justify-content:center;margin:16px 0 21px}.art{order:0;min-height:215px}.art .aura{width:205px;height:205px}.art svg{width:220px}.intro-copy .tag{margin-bottom:15px}.intro-copy h1{font-size:29px}.question-card{padding:24px 18px}.answer-row{flex-direction:column}.answer-row .yellow-btn{width:100%}.math-box{padding:14px 3px}.formula-row{font-size:17px;gap:6px}.sum .sigma{font-size:30px}.sum .limit{font-size:10px}.steps{margin:23px auto}.step-line{width:52px}.decor{opacity:.23}.slot{min-width:80px;padding:5px 8px}.reveal-btn{font-size:16px}.unlock{padding:22px 12px 27px}.gift-sheet{padding:31px 22px 25px}}
    @media(max-width:355px){.content{padding:28px 14px}.math-box .formula-row{font-size:15px}.slot{min-width:70px;font-size:14px}.brand{font-size:10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

  <main class="app" id="app">
    <header class="topbar"><div class="brand"><span class="spark">✳</span> A LITTLE SECRET FOR YOU</div><button class="reset" id="resetBtn" type="button" aria-label="重新开始">↻ 重新开始</button></header>
    <section class="sheet" aria-label="三道谜题，一封来信"><div class="paper-top"></div>
      <div class="content" id="screen" aria-live="polite"></div>
      <footer class="unlock" aria-label="逐步解锁的句子">
        <div class="small">✦ 一句还没说完的话 ✦</div>

        <button id="revealBtn" class="yellow-btn reveal-btn" type="button" disabled aria-disabled="true">先收集三个答案 ⭐</button>

  <div class="modal-overlay" id="giftOverlay" hidden>

      <h2 class="serif" id="giftTitle">诶？这里还有东西！</h2>
      <p class="gift-intro" id="giftDesc">原来，除了刚刚那句话，<br />我还悄悄藏了两个数字密码。</p>
      <div class="tracking" id="trackingCards"></div>
      <div class="gift-question serif">猜猜这些数字有什么用呢～</div>
      <div class="gift-ending">嘘，先留一点点悬念给你 ☆</div>

  <script>
    "use strict";
    /**********************************************************************
     * ★ 使用前只需要修改这里 ★
     * 将下面的两个空字符串，分别替换为你的两个真实快递单号。
     * 示例（仅示范写法，请勿直接使用）：trackingNumbers: ["12345678", "87654321"]
     * 若尚未拿到单号，保留空字符串即可，网页会显示“神秘数字尚未填写”。
     * 注意：单文件静态网页并不能阻止懂技术的人查看源代码，请勿填入收件地址、手机号。
     **********************************************************************/
    const CONFIG = {
      trackingNumbers: ["G156242", "S439600"]
    };

    const STORE_KEY = "little-sunshine-secret-v1";
    const puzzles = [
      { title:"第一关 · 数字迷宫", subtitle:"有些数字，值得花一点时间去寻找。", kind:"math", answers:["18","十八"], placeholder:"写下你找到的数字…", hints:[
        "两个对数的底数不一样，能否先把它们换成同一个底数？",
        "令 t = log₂(x−2)。根据换底公式，log₍ₓ₋₂₎16 = 4/t。",
        "整理得到 t²−5t+4=0。两个候选值里，别忘了使用 x>6 这个条件。"
      ]},
      { title:"第二关 · 消失的文字", subtitle:"有时候，拿走一点点，反而更接近答案。", kind:"hanzi", answers:["生日"], placeholder:"写下你得到的两个字…", hints:[
        "这一次，减号不是算术符号。",
        "试着把两个汉字拆成不同的组成部分。",
        "星 = 日 + 生；明 = 日 + 月。"
      ]},
      { title:"第三关 · 诗里的密码", subtitle:"上一关的答案，是打开这一关的钥匙。", kind:"poem", answers:["快乐"], placeholder:"写下最终的两个字…", hints:[
        "两行诗的字数与取字顺序都有讲究。",
        "想想上一关两个汉字各有几画。",
        "“生”有5画，“日”有4画：从两句诗中分别取对应位置的字。"
      ]}
    ];
    let state = {progress:0,started:false,errors:0,hintCount:0};
    const $ = id=>document.getElementById(id);
    function loadProgress(){try{const obj=JSON.parse(localStorage.getItem(STORE_KEY)||"null");if(obj&&Number.isInteger(obj.progress)){state.progress=Math.max(0,Math.min(3,obj.progress));state.started=!!obj.started || state.progress>0;}}catch(_){}}
    function saveProgress(){try{localStorage.setItem(STORE_KEY,JSON.stringify({progress:state.progress,started:state.started}));}catch(_){}}
    const envelopeArt = `<div class="art" aria-hidden="true"><div class="aura"></div>
      <svg viewBox="0 0 345 315" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#d5ac58" stroke-width="2"><path d="M36 64l8-11m-11 2l15 3"/><path d="M286 41l7-11m-12 5l17 3"/></g>
        <path d="M102 68c-23-14-40-1-38 22 1 17 22 26 36 32" fill="#ffe9af" stroke="#d4ae64" stroke-width="2"/>
        <path d="M250 68c23-14 40-1 38 22-1 17-22 26-36 32" fill="#ffe9af" stroke="#d4ae64" stroke-width="2"/>
        <path d="M115 93L105 59c-5-20 6-29 22-15l28 27M213 72l28-28c16-14 27-5 22 15l-10 35" fill="#fffdf1" stroke="#d5b174" stroke-width="3" stroke-linejoin="round"/>
        <path d="M111 88C128 61 221 61 244 88c27 31 15 76-5 85H111c-27-21-25-58 0-85z" fill="#fffef9" stroke="#d5b174" stroke-width="3"/>
        <ellipse cx="139" cy="124" rx="4" ry="5" fill="#745838"/><ellipse cx="209" cy="124" rx="4" ry="5" fill="#745838"/>
        <path d="M167 138q7 7 14 0m-7 0v5m-7 0q7 9 14 0" stroke="#745838" stroke-width="2.5" fill="none" stroke-linecap="round"/><ellipse cx="122" cy="138" rx="13" ry="7" fill="#f6c1a5" opacity=".65"/><ellipse cx="225" cy="138" rx="13" ry="7" fill="#f6c1a5" opacity=".65"/>
        <rect x="41" y="153" width="266" height="139" rx="17" fill="#fff4d3" stroke="#deb970" stroke-width="3"/>
        <path d="M41 169l125 89c6 5 12 5 18 0l123-89" fill="#ffebb5" stroke="#deb970" stroke-width="3"/>
        <path d="M41 282l95-76m171 76l-95-76" stroke="#deb970" stroke-width="3" fill="none"/>
        <path d="M163 212c-3-12-20-11-20 2 0 13 31 27 31 27s31-14 31-27c0-13-17-14-21-2l-10 8z" fill="#edb8a6" stroke="#cf9b85" stroke-width="1.5"/>
        <path d="M275 77l8-22 9 23 22 7-21 9-9 22-9-23-23-8z" fill="#ffd666" stroke="#d9af51" stroke-width="2"/>
        <path d="M34 143l5-16 7 16 16 6-17 6-6 15-6-15-16-6z" fill="#ffdd82" stroke="#d9b663" stroke-width="1.5"/>
        <g transform="translate(281 240)"><ellipse cx="0" cy="-24" rx="10" ry="18" fill="#fffefa" stroke="#d8b66e"/><ellipse cx="0" cy="24" rx="10" ry="18" fill="#fffefa" stroke="#d8b66e"/><ellipse cx="-24" cy="0" rx="18" ry="10" fill="#fffefa" stroke="#d8b66e"/><ellipse cx="24" cy="0" rx="18" ry="10" fill="#fffefa" stroke="#d8b66e"/><circle cx="0" cy="0" r="15" fill="#ffd666" stroke="#d8b66e"/></g>
        <g transform="translate(63 286) rotate(-15)"><path d="M0 0Q-19-18-12-34Q3-43 0-20Q8-43 20-31Q24-18 0 0" fill="#9eb786" stroke="#789868" stroke-width="2"/></g>
      </svg></div>`;
    function introView(){return `<div class="view intro-grid"><div class="intro-copy"><div class="tag">✿ 一封有点特别的来信</div><h1 class="serif">嘿，<br>有个小秘密<br>想请你发现。</h1><p>三个小小的谜题，藏着一句还没说完的话。准备好动动脑筋了吗？</p><div class="little-note">✦ 不着急，慢慢来。惊喜会等你。</div><button class="yellow-btn big" id="startBtn" type="button">拆开这封信 <span class="arrow">↗</span></button></div>${envelopeArt}</div>`;}
    function stepView(){return `<div class="steps" aria-label="解谜进度：完成 ${state.progress} 道，共三道">${[0,1,2].map((i)=>`${i?`<div class="step-line ${state.progress>i?'complete':''}"></div>`:""}<span class="step-circle ${i<state.progress?'complete':i===state.progress?'current':''}">${i<state.progress?'✓':('0'+(i+1))}</span>`).join('')}</div>`;}
    function mathMarkup(){return `<div class="math-box" role="group" aria-label="以 2 为底，x 减 2 的对数，加上以 x 减 2 为底，16 的对数，等于 5；并且 x 大于 6。"><div class="formula-row math-expression"><span>log<sub>2</sub>(x − 2)</span><span>+</span><span>log<sub>x−2</sub>16</span><span>= 5</span></div><div class="formula-note">附加条件：x &gt; 6</div></div>`;}
    function puzzleBody(){switch(state.progress){case 0:return `<p class="prompt">已知实数 <strong>x &gt; 6</strong>，满足下面的等式，请求出 <strong>x</strong> 的值。</p>${mathMarkup()}`;case 1:return `<p class="prompt">这次的减号，可不一定是在做数学运算哦~</p><div class="character-math"><div class="char-box">星 − 日 = ?</div><div class="char-box">明 − 月 = ?</div></div></p>`;case 2:return `<p class="prompt">上一关的答案，是这一关的钥匙！</p><div class="poem"><p>愿你从此快意乘风</p><p>愿你常乐且自安然</p></div>`;default:return ''}}
    function questionView(){const q=puzzles[state.progress];return `<div class="view"><div class="q-head"><span class="tag">✦ CHAPTER 0${state.progress+1} / 03</span><h2 class="serif">${q.title}</h2><p>${q.subtitle}</p></div>${stepView()}<div class="question-card"><div class="qid">A SMALL QUESTION FOR YOU</div>${puzzleBody()}<form id="answerForm" autocomplete="off"><label class="answer-label" for="answerInput">你的答案</label><div class="answer-row"><input class="answer-input" id="answerInput" name="answer" enterkeyhint="done" autocomplete="off" spellcheck="false" maxlength="30" placeholder="${q.placeholder}" required aria-describedby="feedback" /><button class="yellow-btn" type="submit">确认答案 <span aria-hidden="true">→</span></button></div></form><div class="hint-row"><button id="hintBtn" class="hint-btn" type="button">✦ 需要一点小提示吗？（${state.hintCount}/3）</button><span class="feedback" id="feedback" role="status" aria-live="polite"></span></div><div id="hintArea"></div></div></div>`;}
    function completeView(){return `<div class="view"><div class="complete-wrap"><div class="sparkle-mark">✿</div><div class="tag">ALL SECRETS UNLOCKED</div><h2 class="serif">哇，被你全部解开啦！</h2><p>每一道答案，都悄悄变成一句话的一部分。</p><p>不过……故事好像还没有结束。</p><div class="complete-stamp">✦ 最后的惊喜，藏在下面那个按钮里 ✦</div></div></div>`;}
    function renderSlots(){let parts=[state.progress>=1?"18岁":"？？",state.progress>=2?"生日":"？？",state.progress>=3?"快乐":"？？"];$("wordSlots").innerHTML=parts.map((x,i)=>`<span class="slot ${state.progress>i?'open':''}" aria-label="${state.progress>i?x:'尚未解锁'}">${x}</span>`).join('');const btn=$("revealBtn");btn.disabled=state.progress!==3;btn.setAttribute('aria-disabled',String(state.progress!==3));btn.classList.toggle('ready',state.progress===3);btn.innerHTML=state.progress===3?'18岁生日快乐！ &nbsp; ⭐':'先收集三个答案 ⭐';$("unlockFoot").textContent=state.progress===3?'悄悄点一下，还有一个小惊喜。':`已经解锁 ${state.progress} / 3 个秘密。全部解开后，就能打开这句话啦。`;}
    function render(){const screen=$("screen");screen.innerHTML=!state.started?introView():state.progress<3?questionView():completeView();renderSlots();if(!state.started){$("startBtn").addEventListener('click',()=>{state.started=true;saveProgress();render();});}else if(state.progress<3){$("answerForm").addEventListener('submit',onAnswer);$("hintBtn").addEventListener('click',nextHint);renderHint();}}
    function normalize(s){return s.normalize('NFKC').trim().replace(/[\s\u3000，。？！!,.]/g,'');}
    function onAnswer(event){event.preventDefault();const val=normalize($("answerInput").value);const q=puzzles[state.progress];const feedback=$("feedback");if(q.answers.includes(val)){feedback.textContent=['第一颗星星亮起来啦！','居然被你发现啦！','全部都答对啦，好厉害！'][state.progress];feedback.className='feedback ok';const button=$("answerForm").querySelector('button[type="submit"]');button.disabled=true;button.textContent='回答正确 ✓';const delay=window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:670;window.setTimeout(()=>{state.progress=Math.min(3,state.progress+1);state.errors=0;state.hintCount=0;saveProgress();render();if(state.progress===3)confetti(28);},delay);}else{state.errors++;feedback.textContent=state.errors>=2?'差一点点！可以点开小提示看看～':'唔，再想想看，你可以的。';feedback.className='feedback';$("answerInput").select();}}
    function nextHint(){if(state.hintCount>=3)return;state.hintCount++;renderHint();}
    function renderHint(){const b=$("hintBtn");if(!b)return;b.textContent=state.hintCount>=3?'✦ 小提示已全部解锁':`✦ 需要一点小提示吗？（${state.hintCount}/3）`;b.disabled=state.hintCount>=3;const area=$("hintArea");area.innerHTML=puzzles[state.progress].hints.slice(0,state.hintCount).map((s,i)=>`<div class="hint-card">💡 提示 ${i+1}：${s}</div>`).join('');}
    function makeTrackingCards(){const wrap=$("trackingCards");wrap.replaceChildren();CONFIG.trackingNumbers.slice(0,2).forEach((value,i)=>{const configured=String(value||'').trim().length>0;const card=document.createElement('div');card.className='tracking-card';const head=document.createElement('div');head.className='tracking-head';const name=document.createElement('span');name.textContent=`✦ 第 ${i+1===1?'一':'二'} 串神秘数字`;const copy=document.createElement('button');copy.className='copy-btn';copy.type='button';copy.textContent='复制';copy.disabled=!configured;copy.setAttribute('aria-label',`复制第${i+1}串数字`);copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(String(value));copy.textContent='已复制 ✓';window.setTimeout(()=>{copy.textContent='复制'},1500);}catch(_){copy.textContent='请长按数字复制';}});head.append(name,copy);const number=document.createElement('div');number.className='tracking-number';number.textContent=configured?String(value):'✦ 等待填写的神秘数字 ✦';const note=document.createElement('div');note.className='tracking-note';note.textContent=configured?'这串数字，是一个小小的线索。':'发送前请在 HTML 的 CONFIG 中填入单号。';card.append(head,number,note);wrap.append(card);});}
    let lastFocusedElement=null;
    function openGift(){if(state.progress!==3)return;lastFocusedElement=document.activeElement;makeTrackingCards();$("giftOverlay").hidden=false;document.body.style.overflow='hidden';$("closeGift").focus();confetti(34);}
    function closeGift(){if($("giftOverlay").hidden)return;$("giftOverlay").hidden=true;document.body.style.overflow='';lastFocusedElement?.focus();}
    function confetti(count){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#f6c548','#ffe18d','#e8a7a1','#a7be81','#fff3d1'];for(let i=0;i<count;i++){const bit=document.createElement('span');bit.className='confetti';bit.style.setProperty('--x',`${Math.random()*100}vw`);bit.style.setProperty('--s',`${5+Math.random()*7}px`);bit.style.setProperty('--c',colors[Math.floor(Math.random()*colors.length)]);bit.style.setProperty('--r',`${Math.random()*240}deg`);bit.style.setProperty('--t',`${2.4+Math.random()*2}s`);bit.style.setProperty('--drift',`${-100+Math.random()*200}px`);document.body.append(bit);bit.addEventListener('animationend',()=>bit.remove(),{once:true});}}
    $("resetBtn").addEventListener('click',()=>{if(state.progress===0&&!state.started)return;if(!window.confirm('要重新开始这场小小的探索吗？已经解锁的进度会清空哦。'))return;state={progress:0,started:false,errors:0,hintCount:0};saveProgress();closeGift();render();window.scrollTo({top:0,behavior:'smooth'});});
    $("revealBtn").addEventListener('click',openGift);$("closeGift").addEventListener('click',closeGift);$("giftOverlay").addEventListener('click',e=>{if(e.target===$("giftOverlay"))closeGift();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGift();if(!$("giftOverlay").hidden && e.key==='Tab'){const modal=$("giftOverlay");const els=[...modal.querySelectorAll('button:not([disabled])')];const first=els[0],last=els[els.length-1];if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus()}}});
    loadProgress();render();
  </script>
</body>
</html>
